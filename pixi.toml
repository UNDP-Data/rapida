[project]
name = "rapida"
version = "0.1.0"
description = "Tools for natural hazards assessment"
authors = ["Ioan Ferencik <data@undp.org>"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.12"
gdal = ">=3.12.0"
osmium-tool = ">=1.19.1"
h5py = ">=3.11.0"
libgdal-netcdf = "*"

[pypi-dependencies]
rapida = { path = ".", editable = true }
dotenv-cli = "*"

[activation.env]
PLAYWRIGHT_BROWSERS_PATH = "${PIXI_PROJECT_ROOT}/.pixi/playwright-browsers"

[tasks]
setup = { cmd = "dotenv -e .env playwright install chromium --only-shell" }
rapida = { cmd = "dotenv -e .env rapida" }