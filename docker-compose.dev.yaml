services:
  rapida-dev:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: prod
    image: rapida-dev:latest
    volumes:
      - ./Makefile:/rapida/Makefile
      - ./rapida:/rapida/rapida # mount rapida folder to container
      - ./tests:/rapida/tests
      # uncomment to mount token info from local
      # - ~/.rapida:/root/.rapida
      # uncomment to mount data folder from local
      # - ./data:/data
    environment:
      # This allows the container to find the modified rapida source code in the mounted volume
      - PYTHONPATH=/rapida
    env_file:
      - .env
