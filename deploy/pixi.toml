[workspace]
name = "rapida"
channels = ["conda-forge"]
platforms = [
    "linux-64",
    "win-64",
    # pyvalhalla only ships a macosx_14_0_arm64 wheel; without raising the macOS floor
    # pixi considers it incompatible and falls back to building it from source, which
    # fails in CMake (prime_server not found).
    { platform = "osx-arm64", macos = "14.0" },
]

[dependencies]
# Heavy binary geospatial drivers and libraries
python = ">=3.12"
numpy = "<2"
gdal = ">=3.12.0"
libgdal-netcdf = "*"
osmium-tool = ">=1.19.1,<2"
h5py = ">=3.11.0"
#playwright="*"
#fiona = "*"
#rasterio = "*"
#geopandas = "*"
#shapely = "*"
#exactextract = "*"
#rio-cogeo = "*"
#pyarrow = "*"
#h5py = ">=3.16.0"
#satpy = ">=0.59.0"
#matplotlib = ">=3.10.9"
#netcdf4 = ">=1.7.3"
#h5netcdf = ">=1.8.1"
#marimo = ">=0.23.14,<0.24"

[pypi-dependencies]
# Pixi natively understands Git URLs in the pypi section in pyproject.toml
rapida = { git = "https://github.com/UNDP-Data/rapida.git", branch = "main" }
dotenv-cli="*"
#maplibre = { version = ">=0.3.6, <0.4", extras = ["ipywidget"] }
#openlayers = ">=0.1.6, <0.2"

[activation.env]
# Forces Playwright to install browsers inside the local project folder
PLAYWRIGHT_BROWSERS_PATH = ".pixi/playwright-browsers"


[tasks]
setup = {cmd = "dotenv -e .env playwright install chromium --only-shell"}

rapida = {cmd = "dotenv -e .env rapida"}
#rapida = "dotenv -e .env rapida"